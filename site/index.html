<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC snapshot picker — ssc2</title>
<style>
  :root{
    --navy:#123a63;        /* Stata-GUI navy */
    --navy-soft:#e8eef5;
    --ink:#20242a;
    --muted:#5c6572;
    --paper:#fafbfc;
    --line:#d7dde4;
    --console-bg:#171b21;  /* Stata dark results window */
    --console-ink:#e6e9ec;
    --console-dim:#8a949f;
    --console-good:#7fd08c;/* Stata result green */
    --console-err:#e07a7a; /* Stata error red */
    --accent:#1b6fae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:2.5rem 1.25rem 4rem;
  }
  main{max-width:700px;margin:0 auto}
  h1{
    font-family:Charter,Georgia,"Times New Roman",serif;
    font-size:2rem;font-weight:700;letter-spacing:-.01em;color:var(--navy);
  }
  .kicker{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:.4rem;
  }
  .lede{color:var(--muted);margin:.6rem 0 2rem;max-width:56ch}
  .lede code{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:.9em;color:var(--navy)}

  fieldset{border:1px solid var(--line);border-radius:8px;background:#fff;
    padding:1.25rem 1.25rem 1.4rem;margin-bottom:1.1rem}
  legend{font-family:Charter,Georgia,serif;font-weight:700;color:var(--navy);
    padding:0 .5rem;font-size:1.05rem}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.35rem}
  .hint{font-size:.8rem;color:var(--muted);font-weight:400}
  input[type=text]{
    width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;
    font:inherit;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:.95rem;
  }
  input[type=text]:focus,input[type=date]:focus,input[type=range]:focus-visible,
  button:focus-visible,input[type=checkbox]:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
  .check{display:flex;gap:.55rem;align-items:flex-start;font-weight:400;font-size:.9rem;cursor:pointer}
  .check input{margin-top:.22rem;accent-color:var(--navy)}
  .check b{font-weight:600}

  /* autocomplete */
  .acwrap{position:relative}
  #ac{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:6;display:none;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    box-shadow:0 8px 20px rgba(18,58,99,.14);max-height:15rem;overflow-y:auto}
  .ac-item{padding:.4rem .75rem;cursor:pointer;
    font:.9rem ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
  .ac-item.sel,.ac-item:hover{background:var(--navy-soft);color:var(--navy)}

  /* timeline */
  .timeline{margin-top:.9rem}
  input[type=range]{width:100%;accent-color:var(--navy);cursor:pointer}
  .tl-labels{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);
    font-family:ui-monospace,Consolas,Menlo,monospace;margin-top:.15rem}
  .tl-readout{
    display:flex;gap:.9rem;align-items:baseline;margin-top:.6rem;flex-wrap:wrap}
  .tl-date{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:1.25rem;
    font-weight:700;color:var(--navy)}
  .snapnote{font-size:.8rem;color:#8a6d1f;background:#fbf3da;border-radius:4px;
    padding:.1rem .45rem;display:none}
  .snapnote.show{display:inline-block}
  input[type=date]{padding:.35rem .5rem;border:1px solid var(--line);border-radius:6px;
    font:inherit;font-size:.85rem}
  .disabledzone{opacity:.45}
  input:disabled{cursor:not-allowed}
  .check input:disabled + span{opacity:.5}

  /* the signature: Stata results window */
  .results{
    background:var(--console-bg);border-radius:8px;overflow:hidden;
    box-shadow:0 6px 24px rgba(18,58,99,.18)}
  .results-bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy);color:#dce7f2;font-size:.75rem;
    letter-spacing:.08em;text-transform:uppercase;padding:.45rem .9rem}
  .results-bar button{
    font:inherit;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;
    border-radius:4px;padding:.2rem .7rem;cursor:pointer}
  .results-bar button:hover{background:rgba(255,255,255,.12)}
  pre{
    padding:1rem 1.1rem 1.15rem;color:var(--console-ink);
    font:0.88rem/1.65 ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    white-space:pre-wrap;word-break:break-all}
  pre .p{color:var(--console-dim)}          /* the ". " prompt */
  pre .cm{color:var(--console-dim);font-style:italic}
  pre .opt{color:var(--console-good)}
  pre .err{color:var(--console-err)}
  .cursor{display:inline-block;width:.55em;height:1.05em;background:var(--console-ink);
    vertical-align:-0.15em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.cursor{animation:none}}

  .topnav{background:var(--navy);margin:-2.5rem -1.25rem 2.2rem;padding:0 1.25rem}
  .nav-inner{max-width:700px;margin:0 auto;display:flex;gap:1.4rem;align-items:center}
  .topnav a{color:#c8d8e8;text-decoration:none;font-size:.9rem;padding:.7rem 0}
  .topnav a:hover{color:#fff}
  .topnav a.on{color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 #fff}
  .topnav .brand{font-family:ui-monospace,Consolas,Menlo,monospace;font-weight:700;
    font-size:1rem;color:#fff}
  select{padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;
    font:inherit;font-size:.9rem;background:#fff;max-width:100%}
  .pkgrow{display:flex;gap:.5rem;margin-bottom:.55rem;align-items:center}
  .pkgrow .acwrap{flex:1}
  .delbtn,.addbtn{font:inherit;border:1px solid var(--line);background:#fff;
    border-radius:6px;cursor:pointer;color:var(--navy)}
  .delbtn{width:2.2rem;height:2.2rem;font-size:1.1rem;line-height:1}
  .delbtn:disabled{opacity:.35;cursor:not-allowed}
  .addbtn{padding:.4rem .8rem;font-size:.85rem;margin:.2rem 0 .9rem}
  .delbtn:hover:not(:disabled),.addbtn:hover{background:var(--navy-soft)}
  .snapbox{margin-bottom:1.1rem}
  footer a{color:var(--accent)}
  footer{margin-top:2.2rem;font-size:.8rem;color:var(--muted);line-height:1.7}
  footer code{font-family:ui-monospace,Consolas,Menlo,monospace;color:var(--navy)}
</style>
</head>

<nav class="topnav"><div class="nav-inner">
  <a class="brand on" href="index.html">ssc2</a>
  <a href="about.html">About</a>
  <a href="reference.html">Reference</a>
  <a href="articles.html">Articles</a>
</div></nav>
<main>
  <div class="kicker">ssc2 · SSC archive time machine</div>
  <h1>Install Stata packages from a point in time</h1>
  <p class="lede">Pick a date for each package and this page writes the
    <code>ssc2</code> commands that install packages exactly as the SSC
    archive stood on that day.</p>

  <fieldset>
    <legend>Packages</legend>
    <label>Package names
      <span class="hint">(one per row; each package gets its own snapshot below)</span></label>
    <div id="pkgrows"></div>
    <button type="button" id="addrow" class="addbtn">+ add another package</button>
    <label class="check">
      <input type="checkbox" id="replaceopt" checked>
      <span><b>Replace any installed version</b> (adds <code>replaceall</code>)
      <span class="hint">dated installs refuse to overwrite a different
      installed version unless told to; replaceall permits upgrades and
      downgrades alike</span></span>
    </label>
    <label class="check" style="margin-top:.5rem">
      <input type="checkbox" id="bootstrap">
      <span>Include the one-time <b>ssc2 installation</b> line</span>
    </label>
  </fieldset>

  <fieldset>
    <legend>Mirror</legend>
    <label for="mirrorsel">Snapshot mirror
      <span class="hint">(institutions can run internal mirrors with the same
      layout; a custom mirror is set once per session, not per package)</span></label>
    <div class="row" style="width:100%">
      <select id="mirrorsel" style="flex:1">
        <option value="default">labordynamicsinstitute/ssc-mirror &mdash; public, GitHub</option>
        <option value="custom">custom mirror URL&hellip;</option>
      </select>
    </div>
    <input type="text" id="mirrorurl" placeholder="https://mirror.example.edu/ssc-mirror"
           spellcheck="false" style="display:none;margin-top:.6rem">
  </fieldset>

  <div id="snapzone"></div>

  <div class="results">
    <div class="results-bar"><span>Results</span>
      <button id="copybtn" type="button">Copy</button></div>
    <pre id="out"></pre>
  </div>

  <footer id="stats"></footer>
</main>

function buildSnapshotList(extra){
  const out = [...INCLUDES, ...(extra||[])];
  const miss = new Set(MISSING);
  const d = new Date(DAILY_START+"T00:00:00Z"), end = new Date(LAST_SNAPSHOT+"T00:00:00Z");
  for(; d<=end; d.setUTCDate(d.getUTCDate()+1)){
    const iso = d.toISOString().slice(0,10);
    if(!miss.has(iso)) out.push(iso);
  }
  return [...new Set(out)].sort();
}
let SNAPSHOTS = buildSnapshotList();

const $ = id => document.getElementById(id);
const DEFAULT_MIRROR = "https://raw.githubusercontent.com/labordynamicsinstitute/ssc-mirror";
const DEFAULT_DATE = "2022-01-07";
const VALID = /^[a-z_][a-z0-9_]*$/;

function mirrorURL(){
  if($("mirrorsel").value !== "custom") return DEFAULT_MIRROR;
  const v = $("mirrorurl").value.trim().replace(/\/+$/,"");
  return v || DEFAULT_MIRROR;
}
function nearestIndex(iso){
  let lo=0, hi=SNAPSHOTS.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; SNAPSHOTS[mid]<iso ? lo=mid+1 : hi=mid; }
  if(lo>0 && Math.abs(Date.parse(SNAPSHOTS[lo-1])-Date.parse(iso)) <
             Math.abs(Date.parse(SNAPSHOTS[lo])  -Date.parse(iso))) lo--;
  return lo;
}

/* ------------------------ package rows + snapshots ------------------- */
let rows = [], nextId = 1;

function rowDate(row){ return SNAPSHOTS[+row.el.tl.value]; }

function syncLegend(row){
  const name = row.pkg.trim().split(/\s+/)[0] ||
               ("package " + (rows.indexOf(row)+1));
  row.el.legend.textContent = "Snapshot \u2014 " + name;
}

function initRowSlider(row, keepDate){
  row.el.tl.max = SNAPSHOTS.length-1;
  let i = SNAPSHOTS.indexOf(keepDate);
  if(i < 0) i = nearestIndex(keepDate || LAST_SNAPSHOT);
  row.el.tl.value = i;
  row.el.min.textContent = SNAPSHOTS[0];
  row.el.max.textContent = SNAPSHOTS[SNAPSHOTS.length-1];
  row.el.pick.min = SNAPSHOTS[0];
  row.el.pick.max = SNAPSHOTS[SNAPSHOTS.length-1];
  row.el.pick.value = SNAPSHOTS[i];
}

function addRow(pkg){
  const row = { id: nextId++, pkg: pkg||"" };

  const pr = document.createElement("div");
  pr.className = "pkgrow";
  pr.innerHTML = '<div class="acwrap">' +
    '<input type="text" class="pkginput" spellcheck="false" autocomplete="off"' +
    ' placeholder="package name" role="combobox"></div>' +
    '<button type="button" class="delbtn" title="remove this package">&minus;</button>';
  const input = pr.querySelector("input");
  input.value = row.pkg;
  $("pkgrows").appendChild(pr);

  const fs = document.createElement("fieldset");
  fs.className = "snapbox";
  fs.innerHTML = '<legend></legend>' +
    '<label class="check"><input type="checkbox" class="freeze" checked>' +
    '<span><b>Freeze package versions to a dated snapshot?</b> ' +
    '<span class="hint">Freezing enhances reproducibility: anyone running your ' +
    'code later installs the same package version you used.</span></span></label>' +
    '<div class="timeline">' +
    '<input type="range" class="tl" min="0" step="1" aria-label="Snapshot date timeline">' +
    '<div class="tl-labels"><span class="tl-min"></span><span class="tl-max"></span></div>' +
    '<div class="tl-readout"><span class="tl-date"></span>' +
    '<input type="date" class="datepick" aria-label="Jump to date">' +
    '<span class="snapnote"></span></div></div>';
  $("snapzone").appendChild(fs);

  row.el = { pr, fs, input,
    legend: fs.querySelector("legend"),
    freeze: fs.querySelector(".freeze"),
    zone:   fs.querySelector(".timeline"),
    tl:     fs.querySelector(".tl"),
    min:    fs.querySelector(".tl-min"),
    max:    fs.querySelector(".tl-max"),
    date:   fs.querySelector(".tl-date"),
    pick:   fs.querySelector(".datepick"),
    note:   fs.querySelector(".snapnote") };
  initRowSlider(row, DEFAULT_DATE);

  input.addEventListener("input", ()=>{ row.pkg = input.value;
    syncLegend(row); acShow(input); render(); });
  input.addEventListener("focus", ()=>acAttach(input));
  input.addEventListener("keydown", acKeydown);
  input.addEventListener("blur", ()=>setTimeout(acHide, 120));
  pr.querySelector(".delbtn").addEventListener("click", ()=>removeRow(row));
  row.el.freeze.addEventListener("change", render);
  row.el.tl.addEventListener("input", ()=>{ row.el.pick.value = rowDate(row); render(); });
  row.el.pick.addEventListener("change", e=>{
    if(!e.target.value) return;
    const i = nearestIndex(e.target.value);
    if(SNAPSHOTS[i] !== e.target.value){
      row.el.note.textContent =
        "no snapshot on " + e.target.value + " \u2014 snapped to " + SNAPSHOTS[i];
      row.el.note.classList.add("show");
      setTimeout(()=>row.el.note.classList.remove("show"), 4000);
    } else row.el.note.classList.remove("show");
    row.el.tl.value = i;
    row.el.pick.value = SNAPSHOTS[i];
    render();
  });

  rows.push(row);
  syncLegend(row);
  updateDelButtons();
  render();
}

function removeRow(row){
  if(rows.length === 1) return;
  row.el.pr.remove(); row.el.fs.remove();
  rows = rows.filter(r => r !== row);
  rows.forEach(syncLegend);
  updateDelButtons();
  render();
}
function updateDelButtons(){
  document.querySelectorAll(".delbtn").forEach(b => b.disabled = rows.length===1);
}
$("addrow").addEventListener("click", ()=>{ addRow(""); rows[rows.length-1].el.input.focus(); });

  const lines = [];
  if($("bootstrap").checked){
    lines.push('<span class="cm">* one-time: install the ssc2 command itself</span>');
    // TODO AT MERGE: change ian-joyce -> labordynamicsinstitute once the
    // rewrite is merged upstream (upstream main still serves ssc2 v1.1.7)
    lines.push('<span class="p">. </span>net install ssc2, all replace from("https://raw.githubusercontent.com/ian-joyce/stata-ssc2/main")');
    lines.push('');
  }
  if(mirrorURL() !== DEFAULT_MIRROR){
    const safe = mirrorURL().replace(/["<>&]/g,"");
    lines.push('<span class="cm">* point ssc2 at your mirror (once per session,</span>');
    lines.push('<span class="cm">* or put this line in your profile.do)</span>');
    lines.push('<span class="p">. </span>global SSC2_MIRROR "' + safe + '"');
    lines.push('');
  }
  let any = false;
  for(const row of rows){
    const frozen = row.el.freeze.checked;
    row.el.zone.classList.toggle("disabledzone", !frozen);
    row.el.tl.disabled = !frozen;
    row.el.pick.disabled = !frozen;
    row.el.date.textContent = rowDate(row);
    const toks = row.pkg.trim().toLowerCase().split(/\s+/).filter(Boolean);
    for(const n of toks){
      any = true;
      if(!VALID.test(n)){
        lines.push('<span class="err">"' + n.replace(/[<>&]/g,"") +
                   '" is not a valid package name</span>');
        continue;
      }
      const opts = [];
      if(frozen) opts.push("date(" + rowDate(row) + ")");
      if($("replaceopt").checked) opts.push("replaceall");
      const opt = opts.length ? ', <span class="opt">' + opts.join(" ") + '</span>' : "";
      lines.push('<span class="p">. </span>ssc2 install ' + n + opt);
    }
  }
  if(!any){
    lines.push('<span class="err">Enter a package name above to generate a command.</span>');
  }
  $("out").innerHTML = lines.join("\n") +
    '\n<span class="p">. </span><span class="cursor"></span>';
}
["replaceopt","bootstrap","mirrorurl"].forEach(id=>{
  ["input","change"].forEach(ev=>$(id).addEventListener(ev, render));
});
$("mirrorsel").addEventListener("change", ()=>{
  $("mirrorurl").style.display = $("mirrorsel").value==="custom" ? "block" : "none";
  renderStats($("mirrorsel").value==="custom"
    ? " \u2014 note: the timelines reflect the public mirror's coverage" : "");
  render();
});

$("copybtn").addEventListener("click", ()=>{
  const text = $("out").innerText.replace(/^\. /gm,"").replace(/\n\.?\s*$/,"").trimEnd();
  const done = ()=>{ $("copybtn").textContent="Copied";
                     setTimeout(()=>$("copybtn").textContent="Copy",1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text;
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); done();
  }
});

/* ---------------------------- autocomplete --------------------------- */
const acBox = document.createElement("div");
acBox.id = "ac"; acBox.setAttribute("role","listbox");
let acItems = [], acIdx = -1, acInput = null;
function acAttach(input){ acInput = input; input.parentNode.appendChild(acBox); }
function acHide(){ acBox.style.display="none"; acItems=[]; acIdx=-1; }
function acShow(input){
  acAttach(input);
  const m = input.value.match(/([a-z0-9_]*)$/i);
  const tok = (m ? m[1] : "").toLowerCase();
  if(tok.length < 2){ acHide(); return; }
  let list = PACKAGES.filter(p => p.startsWith(tok));
  if(list.length < 8){
    list = list.concat(PACKAGES.filter(p => !p.startsWith(tok) && p.includes(tok))
                               .slice(0, 8 - list.length));
  }
  list = list.slice(0, 8);
  if(!list.length || (list.length===1 && list[0]===tok)){ acHide(); return; }
  acItems = list; acIdx = -1;
  acBox.innerHTML = list.map((n,i) =>
    '<div class="ac-item" role="option" data-i="'+i+'">'+n+'</div>').join("");
  acBox.style.display = "block";
}
function acPick(i){
  acInput.value = acInput.value.replace(/[a-z0-9_]*$/i, acItems[i]);
  const row = rows.find(r => r.el.input === acInput);
  if(row){ row.pkg = acInput.value; syncLegend(row); }
  acHide(); acInput.focus(); render();
}
function acPaint(){
  [...acBox.children].forEach((el,i)=>el.classList.toggle("sel", i===acIdx));
}
function acKeydown(e){
  if(acBox.style.display!=="block") return;
  if(e.key==="ArrowDown"){ e.preventDefault(); acIdx=(acIdx+1)%acItems.length; acPaint(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); acIdx=(acIdx-1+acItems.length)%acItems.length; acPaint(); }
  else if(e.key==="Enter" || e.key==="Tab"){
    if(acIdx>=0){ e.preventDefault(); acPick(acIdx); } else acHide();
  }
  else if(e.key==="Escape"){ acHide(); }
}
acBox.addEventListener("mousedown", e=>{
  const t = e.target.closest(".ac-item");
  if(t){ e.preventDefault(); acPick(+t.dataset.i); }
});

/* ------------------------- freshness top-up -------------------------- */
async function refreshSnapshots(){
  try{
    const r = await fetch(
      "https://api.github.com/repos/labordynamicsinstitute/ssc-mirror/tags?per_page=100",
      {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) return;
    const fresh = (await r.json()).map(t=>t.name)
      .filter(n=>/^\d{4}-\d{2}-\d{2}$/.test(n) && n > LAST_SNAPSHOT).sort();
    if(!fresh.length) return;
    LAST_SNAPSHOT = fresh[fresh.length-1];
    const kept = rows.map(rowDate);
    SNAPSHOTS = buildSnapshotList(fresh);
    rows.forEach((row,i)=>initRowSlider(row, kept[i]));
    renderStats(" \u2014 <b>refreshed live:</b> snapshots through <code>" +
                LAST_SNAPSHOT + "</code> added");
    render();
  }catch(e){ /* offline or rate-limited: embedded data stands */ }
}

function renderStats(extra){
  $("stats").innerHTML =
  "Snapshots: daily from <code>"+DAILY_START+"</code> to <code>"+LAST_SNAPSHOT+
  "</code>, <code>"+SNAPSHOTS.length+"</code> dates in all; exceptions are listed "+
  "in the mirror's <a href=\"https://github.com/labordynamicsinstitute/ssc-mirror/blob/main/ERRATA.md\">ERRATA</a>. "+
  "Autocomplete covers <code>"+PACKAGES.length+"</code> packages. "+
  "Data generated <code>"+BUILD_STAMP+"</code>"+(extra||"")+".";
}

addRow("reghdfe");
renderStats();
refreshSnapshots();
</script>
