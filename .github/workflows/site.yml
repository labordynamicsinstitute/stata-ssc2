# Build and deploy the ssc2 website (site/ directory) via Action-based
# GitHub Pages deployment using Jekyll (just-the-docs theme).
#
#   build:  runs on every PR and every push to main, weekly by cron, and
#           whenever release.yml calls this workflow. Renders version
#           placeholders to the newest stable release tag, then refreshes
#           the embedded snapshot/package data and regenerates the
#           Reference page from the Stata help file, then builds the
#           Jekyll site and uploads the artifact -- rendering runs first
#           so that any @TOKEN@-shaped string spliced in by the data
#           refresh cannot trip render_docs.py's leftover-placeholder
#           check. On PRs this artifact can be downloaded from the run
#           page to inspect the output without deploying anything.
#   deploy: runs only for main (pushes, cron, and release calls), never PRs.
#
# The weekly rebuild keeps embedded data at most 7 days stale; the page's
# own single async API call tops up newer snapshot dates per visit.
# Data regeneration and placeholder rendering happen in CI at build time
# and land in the deployed artifact only -- nothing is committed back to
# the repository, so main keeps its @TOKEN@ placeholders.
#
# Requires: repository Settings -> Pages -> Source = "GitHub Actions".

name: site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"      # Mondays 06:30 UTC (after the mirror's daily run)
  workflow_dispatch: {}
  # Called by release.yml so a new release republishes the site with its
  # install instructions pointing at the version just published.
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tools/render_docs.py resolves the newest stable release tag,
          # which the default shallow checkout does not fetch.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Render version placeholders in the site
        # Edits the CI working copy in place; nothing is committed back.
        # Runs before the data refresh below so that upstream mirror data
        # spliced into index.html cannot introduce an @TOKEN@-shaped
        # string that render_docs.py would otherwise fail the build on.
        run: python3 tools/render_docs.py site/about.md site/index.html
      - name: Refresh embedded snapshot and package data
        run: python3 site/build_data.py site/index.html
      - name: Regenerate Reference page from the Stata help file
        run: python3 site/build_reference.py sthlp/ssc2.sthlp site/reference.md
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site
      - name: Build Jekyll site
        run: bundle exec jekyll build
        working-directory: site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
