# This repository has moved to https://github.com/ssc-ng/ssc2 and the
# website to https://ssc-ng.net/ssc2/. GitHub Pages offers no server-side
# redirects, so this workflow deploys the static stubs in redirect/
# instead of the Jekyll site in site/:
#
#   - index.html, about.html, reference.html, articles.html redirect to
#     their counterparts under https://ssc-ng.net/ssc2/ (JavaScript, with
#     a meta refresh fallback and a canonical link);
#   - 404.html catches every other path and maps /stata-ssc2/<path> to
#     https://ssc-ng.net/ssc2/<path>, keeping query string and fragment.
#
# Run it once (push to main or workflow_dispatch) BEFORE archiving the
# repository: Actions do not run on archived repositories, but the last
# Pages deployment keeps being served.
#
# Requires: repository Settings -> Pages -> Source = "GitHub Actions".

name: site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Still called by release.yml.
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
