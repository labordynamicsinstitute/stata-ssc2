<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ssc2 has moved to ssc-ng.net/ssc2</title>
<meta name="robots" content="noindex">
<script>
  // Map /stata-ssc2/<path> to https://ssc-ng.net/ssc2/<path>, keeping query and fragment.
  var rest = location.pathname.replace(/^\/stata-ssc2(\/|$)/, "");
  location.replace("https://ssc-ng.net/ssc2/" + rest + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://ssc-ng.net/ssc2/"></noscript>
</head>
<body>
<p>The ssc2 website has moved to <a href="https://ssc-ng.net/ssc2/">https://ssc-ng.net/ssc2/</a>.</p>
</body>
</html>
